<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>FT Helper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FT Helper">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="lava" aria-hidden="true"></div>
<div class="deco" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div id="splash">
  <div class="logo">FT</div>
  <div class="sub">helper</div>
  <div class="made">made by Sleep</div>
</div>

<main id="menu" class="screen hidden">
  <h1 class="title">FT <span>helper</span></h1>
  <div class="orn"><b>◆</b></div>
  <div class="buttons">
    <button class="tile" data-go="pvp">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l11 11"/><path d="M13 17l4-4"/><path d="M16 16l3 3"/><path d="M4 4h4L4 8z" fill="currentColor"/><path d="M19 5L8 16"/><path d="M11 17L7 13"/><path d="M8 16l-3 3"/><path d="M20 4h-4l4 4z" fill="currentColor"/></svg></span>
      <span class="label">ПВП</span><i class="arr">→</i>
    </button>
    <button class="tile" data-go="pve">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><rect x="7" y="8" width="3" height="3" fill="currentColor"/><rect x="14" y="8" width="3" height="3" fill="currentColor"/><path d="M10 12h4v4h2v4H8v-4h2z"/></svg></span>
      <span class="label">ПВЕ</span><i class="arr">→</i>
    </button>
    <button class="tile" data-go="profit">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg></span>
      <span class="label">Прибыль</span><i class="arr">→</i>
    </button>
    <button class="tile" data-go="clan">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v8M8.5 12h7"/></svg></span>
      <span class="label">Клан</span><i class="arr">→</i>
    </button>
  </div>
  <div class="credit">made by Sleep</div>
</main>

<section id="page" class="screen hidden">
  <button class="back" id="back">← Назад</button>
  <h2 id="page-title"></h2>
  <div id="page-body"></div>
</section>

<script src="items.js"></script>
<script src="custom.js"></script>
<script src="income.js"></script>
<script src="farms.js"></script>
<script src="profit.js"></script>
<script src="craft.js"></script>
<script src="app.js"></script>
</body>
</html>
